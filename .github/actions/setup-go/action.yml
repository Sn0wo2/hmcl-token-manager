name: Set up Go and cache
description: Restore reusable Go module and build caches

inputs:
  cache-scope:
    description: Build cache workload
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum', 'Makefile') }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

    - uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ inputs.cache-scope }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ inputs.cache-scope }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
